name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Susun folder www dan assets
        run: |
          mkdir -p www assets
          cp admin.html admin.js app.js config.js favicon.svg icon-192.png icon-512.png index.html manifest.webmanifest style.css supabase.js sw.js www/
          mv icon-only.png icon-foreground.png icon-background.png assets/
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0c0c0f' --iconBackgroundColorDark '#0c0c0f'
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
